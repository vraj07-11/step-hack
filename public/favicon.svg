<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Theme Background (Matches #0b0f17 / #0f172a) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Squircle Border Subtle Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Trailing Left Step: Deep Electric Blue -->
    <linearGradient id="leftStepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Leading Right Step: Vibrant Glowing Cyan/Sky -->
    <linearGradient id="rightStepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- App Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Left Sneaker Step (Trailing, Lower-Left) -->
  <g transform="translate(170, 295) rotate(-16)">
    <!-- Sole / Forefoot Outsole -->
    <path d="M 0,-62 C 32,-62 48,-36 46,14 C 44,48 24,68 0,68 C -24,68 -44,48 -46,14 C -48,-36 -32,-62 0,-62 Z"
          fill="url(#leftStepGrad)"/>
    <!-- Heel Outsole -->
    <path d="M 0,90 C 22,90 34,106 32,132 C 30,150 18,162 0,162 C -18,162 -30,150 -32,132 C -34,106 -22,90 0,90 Z"
          fill="url(#leftStepGrad)"/>
    <!-- Athletic Tread Grooves (Negative Space Slots) -->
    <rect x="-26" y="-36" width="52" height="8" rx="4" fill="#080c16"/>
    <rect x="-30" y="-8" width="60" height="8" rx="4" fill="#080c16"/>
    <rect x="-26" y="20" width="52" height="8" rx="4" fill="#080c16"/>
    <rect x="-18" y="118" width="36" height="7" rx="3.5" fill="#080c16"/>
  </g>

  <!-- Right Sneaker Step (Leading, Upper-Right, Elevated) -->
  <g transform="translate(340, 165) rotate(-12)">
    <!-- Sole / Forefoot Outsole -->
    <path d="M 0,-70 C 36,-70 54,-40 52,16 C 50,54 27,76 0,76 C -27,76 -50,54 -52,16 C -54,-40 -36,-70 0,-70 Z"
          fill="url(#rightStepGrad)"/>
    <!-- Heel Outsole -->
    <path d="M 0,100 C 25,100 38,118 36,148 C 34,168 20,182 0,182 C -20,182 -34,168 -36,148 C -38,118 -25,100 0,100 Z"
          fill="url(#rightStepGrad)"/>
    <!-- Athletic Tread Grooves (Negative Space Slots) -->
    <rect x="-30" y="-40" width="60" height="9" rx="4.5" fill="#080c16"/>
    <rect x="-34" y="-8" width="68" height="9" rx="4.5" fill="#080c16"/>
    <rect x="-30" y="24" width="60" height="9" rx="4.5" fill="#080c16"/>
    <rect x="-20" y="132" width="40" height="8" rx="4" fill="#080c16"/>
  </g>
</svg>
